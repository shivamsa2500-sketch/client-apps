<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sign in</title>
<style>
  :root{--bg:#0b0d10;--card:#14181d;--line:#252c35;--tx:#e8edf3;--tx2:#98a4b3;--tx3:#65717f;--acc:#f0b429;--onAcc:#fff}
  html[data-theme="light"]{--bg:#f6f7f9;--card:#fff;--line:#e2e6ec;--tx:#111820;--tx2:#5b6775;--tx3:#8b96a3}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
       background:var(--bg);color:var(--tx);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
  .box{width:100%;max-width:340px;text-align:center}
  .mark{width:52px;height:52px;margin:0 auto 18px;border-radius:14px;background:var(--acc);color:var(--onAcc);
        display:flex;align-items:center;justify-content:center;font-weight:750;font-size:19px;letter-spacing:-.02em}
  h1{margin:0;font-size:19px;font-weight:650;letter-spacing:-.01em}
  .sub{color:var(--tx3);font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;margin-top:5px}
  form{margin-top:22px}
  input{width:100%;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);
        border-radius:11px;padding:12px 14px;outline:none;text-align:center;letter-spacing:.05em}
  input:focus{border-color:var(--acc)}
  button{width:100%;margin-top:9px;font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:11px;
         padding:12px 14px;background:var(--acc);color:var(--onAcc)}
  button:disabled{opacity:.6;cursor:default}
  .err{margin-top:12px;font-size:13px;color:#f87171;min-height:19px}
  .foot{margin-top:26px;font-size:11.5px;color:var(--tx3)}
</style>
</head>
<body>
  <div class="box">
    <div class="mark" id="mark"></div>
    <h1 id="cn"></h1>
    <div class="sub" id="pn"></div>
    <form id="f">
      <input id="pw" type="password" placeholder="Access code" autocomplete="current-password" autofocus>
      <button id="go" type="submit">Open</button>
      <div class="err" id="err"></div>
    </form>
    <div class="foot" id="foot"></div>
  </div>
